# enemy_color: "red"
enemy_color: "blue"

#####-----神经网络参数-----#####
yolo_name: yolov5
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
device: CPU
min_confidence: 0.8
# 合并 sim_probe.yaml 的模拟器诊断配置，关闭传统灯条检测分支。
use_traditional: false

#####-----ROI-----#####
roi: 
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

#####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree
min_confidence: 0.8

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 15
outpost_max_temp_lost_count: 75

# 同一帧只允许综合关联分数最低的一个同名装甲板更新 EKF，单位为等效 rad。
# 分数 = 装甲板角度误差 + 位置误差视线角 + 距离误差视线角。
# 装甲板姿态与视线方位综合误差门限，单位为 rad，约束明显错误的朝向匹配。
association_max_angle_error: 0.35
association_max_score: 0.8
# 远距离下角度归一化可能掩盖较大的空间误差，绝对误差单位为 m。
association_max_position_error: 0.45
association_max_distance_error: 0.45
# 创新协方差归一化残差门限，无量纲；约对应 4 维观测的约 95% 门控范围。
association_max_mahalanobis_distance: 3.2
# 仿真方位观测噪声实验值：约 8px / fx=1304px，单位 rad²。
measurement_bearing_variance: 4e-5

# Daedalus vehicle.glb 的四装甲几何先验，单位为 m / m²。
# 实际前后半径约 0.21177m，左右半径约 0.21117m。
standard_geometry_constraint: true
standard_radius: 0.21147
standard_radius_variance: 1e-4
standard_radius_delta_variance: 1e-4
standard_height_delta_variance: 1e-4

# 限制仿真中的 yaw 重投影优化跨越矩形对称分支，单位为 rad。
max_yaw_optimization_correction: 0.35

#####-----aimer参数-----#####
yaw_offset: -1 # degree -2.5
pitch_offset: -1.4 # degree 2
comming_angle: 60 # degree
leaving_angle: 20 # degree
decision_speed: 6.5 # 临时实验：确保仿真小陀螺进入高速选板分支，单位 rad/s
# 旧版固定高低速延迟配置已废弃，当前实现不再读取。

#####-----shooter参数-----#####
first_tolerance: 3 # 近距离射击容差，degree
second_tolerance: 2 # 远距离射击容差，degree
judge_distance: 2 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击

camera_name: "hikrobot"
exposure_ms: 2
gain: 16
vid_pid: "2bdf:0001"

# Daedalus 模拟器相机参数，来自 /camera_info：
# 图像分辨率为 1440x1080，fx=fy=1303.675283，cx=720，cy=540。
# 模拟器没有镜头畸变。
camera_matrix: [
  1303.675283386667, 0, 720.0,
  0, 1303.675283386667, 540.0,
  0, 0, 1
]
distort_coeffs: [0, 0, 0, 0, 0]

# Daedalus 模拟器相机外参，来自 /tf：
# gimbal_link -> camera_link 平移为
# [0.060025096, 0.002016783, 0.196342170]。
# camera_optical_frame -> gimbal_link 的旋转为：
# [ 0,  0,  1]
# [-1,  0,  0]
# [ 0, -1,  0]
R_camera2gimbal: [
  0, 0, 1,
  -1, 0, 0,
  0, -1, 0
]
t_camera2gimbal: [0.060025096, 0.002016783, 0.196342170]

# 当前探针还没有把 odom -> gimbal_link 的动态姿态送入 Solver，
# 因此先使用单位旋转，world 坐标暂按云台局部坐标解释。
R_gimbal2imubody: [
  1, 0, 0,
  0, 1, 0,
  0, 0, 1
]

#####-----cboard参数-----#####
quaternion_canid: 0x100
bullet_speed_canid: 0x101
send_canid: 0xff
can_interface: "can0"

#####-----gimbal参数-----#####
com_port: "/dev/gimbal"

#####-----planner-----#####
fire_thresh: 0.003

max_yaw_acc: 50
Q_yaw: [9e6, 0]
R_yaw: [1]

max_pitch_acc: 100
Q_pitch: [9e6,0]
R_pitch: [1]

#####-----buff_detector参数-----#####
detect:
  contrast: 1
  brightness: 
    blue: -120
    red: -100
  brightness_threshold:
    blue: 120
    red: 40
  morphology_size:
    blue: 3
    red: 3
  dilate_size: 2
  # canny_low_threshold: 100
  # canny_high_threshold: 180
  # approx_epsilon: 1.0
  R_contours_min_area: 200
  R_contours_max_area: 600
  fanblades_head_contours_min_area: 3000
  fanblades_head_contours_max_area: 8000
  fanblades_body_contours_min_area: 1000
  fanblades_body_contours_max_area: 4000
  standard_fanblade_path: ./assets/standard_fanblade.jpg

#####-----buff_aimer参数-----#####
aim_time: 0.150         # s
wait_time: 0.300        # s
command_fire_gap: 0.080 # s
predict_time: 0.150     # s
