# 只读真机诊断配置；颜色、模型效果和瞄准偏置仍需实车确认。
# 图像与姿态只有主机时间戳，max_image_age_ms 是拒收门限而非延迟补偿。
pose_frame: gimbal
image_size: [1440, 1080]
max_image_age_ms: 200
enemy_color: blue

yolo_name: yolov5
yolov5_model_path: assets/yolov5.xml
classify_model: assets/tiny_resnet.onnx
device: GPU
# 检测器内部的 NMS 阈值（hardcoded score_threshold_）就是 0.7，因此 0.7 是不改代码时的
# 自然下限。交替 A/B 实测（同一距离 5.3~5.6m，各 150 帧）：0.8 会丢掉 39/150 帧，
# 且这 39 帧目标都在视野内、temp_lost_count 多为 1~3，即逐帧闪烁；
# 降到 0.7 后 300 帧零丢帧，tracking 由 102/150 升到 146/150。
min_confidence: 0.7
use_traditional: false
use_roi: false
roi:
    x: 0
    y: 0
    width: 1440
    height: 1080

# YOLOv5 构造时仍会加载传统检测器参数，但此配置不启用传统检测分支。
threshold: 150
max_angle_error: 45
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25

min_detect_count: 5
max_temp_lost_count: 15
outpost_max_temp_lost_count: 75
tracker_max_prediction_gap: 0.3
# 标准四装甲车的半径 r 是已知机械尺寸（0.18 m），而单块装甲观测下 r 不可观测，
# 不约束时会漂移到发散边界并平移瞄点，因此启用几何约束。
standard_geometry_constraint: true
# 倒装相机不使用固定俯仰、零滚转的逐点 yaw 重投影优化。
yaw_optimization_enabled: false

# 零偏置仅用于读数诊断，未经实车射击校准。
yaw_offset: 0
pitch_offset: 0
comming_angle: 55
leaving_angle: 20
decision_speed: 7

# 真机 Planner 先只读对比；弹速反馈为 0 时使用诊断参考值，不能用于开火或控制。
planner_debug_bullet_speed_mps: 23.0
fire_thresh: 0.003
max_yaw_acc: 50
Q_yaw: [9e6, 0]
R_yaw: [1]
max_pitch_acc: 100
Q_pitch: [9e6, 0]
R_pitch: [1]

camera_name: hikrobot
exposure_ms: 2.2
gain: 16.9
vid_pid: "2bdf:0001"

# 来自 configs/intrinsics_real.yaml；图像分辨率为 1440x1080。
# camera_matrix: [1813.2507867127094, 0, 700.04143692942728,
#                 0, 1813.9982777198636, 549.96286809139599,
#                 0, 0, 1]
# distort_coeffs: [-0.078218840095890696, 0.13324667313857205,
#                  -0.00029004829563937019, -0.00044137370499455026, 0]

camera_matrix: [1879.3803642316789, 0, 763.80451096686147, 0, 1882.0824748120281, 529.10011077344768, 0, 0, 1]
distort_coeffs: [-0.059986849348867888, 0.11705288312760548, -0.0020784119367715944, 0.007949430553322482, 0]

# 暂用 configs/handeye_real2.yaml；样本内部残差小不等于实车精度已验收。
# 相机 optical -> 云台，平移单位 m；串口姿态直接进入 Solver，不使用 IMU 安装轴变换。
# R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]
# R_camera2gimbal: [0.0011726325553053842, -0.036881582043640747, 0.99931895500774071,
#                   0.99984459222970212, -0.017535036256947939, -0.0018204099785029695,
#                   0.017590233708307351, 0.99916578774966336, 0.03685528820468352]
# t_camera2gimbal: [0.13577603026517412, -0.0012125070214705784,
#                   0.039475177662960222]


R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]  # 相机同理想情况的偏角: yaw-0.38 pitch2.61 roll-178.83 degree
R_camera2gimbal: [-0.0075607715368703034, -0.045312874593095423, 0.99894423174037672, 0.99976272756067941, -0.020750630168994141, 0.0066257020775661278, 0.020428492704992196, 0.99875730522669703, 0.045459013870583535]
t_camera2gimbal: [0.046517088715588344, 0.0068541777415325727, 0.035286262907062611]
