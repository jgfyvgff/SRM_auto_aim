# 只读真机诊断配置；颜色、模型效果和瞄准偏置仍需实车确认。
# 图像与姿态只有主机时间戳，max_image_age_ms 是拒收门限而非延迟补偿。
pose_frame: gimbal
image_size: [1440, 1080]
max_image_age_ms: 200
enemy_color: blue

yolo_name: yolov5
yolov5_model_path: assets/yolov5.xml
classify_model: assets/tiny_resnet.onnx
device: CPU
min_confidence: 0.8
use_traditional: false
use_roi: false
roi:
    x: 0
    y: 0
    width: 1440
    height: 1080

# YOLOv5 构造时仍会加载传统检测器参数，但此配置不启用传统检测分支。
threshold: 150
max_angle_error: 45
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25

min_detect_count: 5
max_temp_lost_count: 15
outpost_max_temp_lost_count: 75
tracker_max_prediction_gap: 0.3
# 不沿用 Daedalus 模型的装甲板半径约束。
standard_geometry_constraint: false

# 零偏置仅用于读数诊断，未经实车射击校准。
yaw_offset: 0
pitch_offset: 0
comming_angle: 55
leaving_angle: 20
decision_speed: 7

camera_name: hikrobot
exposure_ms: 4
gain: 9
vid_pid: "2bdf:0001"

# 来自 configs/intrinsics_real.yaml；图像分辨率为 1440x1080。
camera_matrix: [1813.2507867127094, 0, 700.04143692942728,
                0, 1813.9982777198636, 549.96286809139599,
                0, 0, 1]
distort_coeffs: [-0.078218840095890696, 0.13324667313857205,
                 -0.00029004829563937019, -0.00044137370499455026, 0]

# 暂用 configs/handeye_real2.yaml；样本内部残差小不等于实车精度已验收。
# 相机 optical -> 云台，平移单位 m；串口姿态直接进入 Solver，不使用 IMU 安装轴变换。
R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]
R_camera2gimbal: [0.0011726325553053842, -0.036881582043640747, 0.99931895500774071,
                  0.99984459222970212, -0.017535036256947939, -0.0018204099785029695,
                  0.017590233708307351, 0.99916578774966336, 0.03685528820468352]
t_camera2gimbal: [0.13577603026517412, -0.0012125070214705784,
                  0.039475177662960222]
