# 只读真机诊断配置；颜色、模型效果和瞄准偏置仍需实车确认。
# 图像与姿态只有主机时间戳，max_image_age_ms 是拒收门限而非延迟补偿。
pose_frame: gimbal
image_size: [1440, 1080]
max_image_age_ms: 200
enemy_color: blue

yolo_name: yolov8
yolov5_model_path: assets/yolov5.xml
# YOLOv8 输出两类颜色和四个灯条端点；数字仍由下面的 Tiny ONNX 分类。
yolov8_model_path: assets/yolov8.xml
classify_model: assets/tiny_resnet.onnx
# 倒装相机的数字在原图中上下颠倒；0.5 次幂提亮暗数字。
# 仅影响 Tiny 的数字分类输入，YOLOv5 直出数字路径不使用该预处理。
classifier_rotate_180: true
classifier_gamma: 0.5
device: GPU
# 以下早期 0.7 的实测只对应 YOLOv5；YOLOv8 的此门限作用于 Tiny 分类置信度，
# 已在 701 帧同源 CPU 回放中重新评估，仍需真机验证。
# YOLOv5 检测器内部的 NMS 阈值（hardcoded score_threshold_）就是 0.7，因此 0.7 是不改代码时的
# 自然下限。交替 A/B 实测（同一距离 5.3~5.6m，各 150 帧）：0.8 会丢掉 39/150 帧，
# 且这 39 帧目标都在视野内、temp_lost_count 多为 1~3，即逐帧闪烁；
# 降到 0.7 后 300 帧零丢帧，tracking 由 102/150 升到 146/150。
min_confidence: 0.7
# YOLOv8 的检测分数门限；与上面的 Tiny 数字分类门限分开记录。
yolov8_score_threshold: 0.7
# YOLOv5 动态 ROI：按上一帧目标框裁剪再缩放到 640，使装甲板在网络输入里保持约 40px。
# 实测 5.8m 处：整帧路径 30/30 帧把 "2" 判成 outpost（追踪器因此按 3 块/r=0.2765 建模），
# 裁剪后 30/30 帧判成 two。关掉即回到原整帧行为，便于 A/B。
dynamic_roi: true
# YOLOv8 的 701 帧同源回放：整帧 tracking 696 帧，动态 ROI tracking 674 帧，
# 且动态 ROI 出现连续 16 帧暂失。真机初次切换先用整帧；v5 保留原 ROI 设置。
yolov8_dynamic_roi: false
# ROI 边长 = 目标框宽 × 该倍率；16 使装甲板在 640 宽输入里恒为 40px（任何距离）。
# 实测 40px 分类正确、30px 仍会错，所以取 16 而不是更激进的倍率。
dynamic_roi_scale: 16.0
# ROI 边长下限：窗口太小会丢掉上下文，影响 NMS 与后续关联。
dynamic_roi_min_width: 320
# 416/640 倍换算仅是 YOLOv8 的几何实验起点，不代表已验证分类效果。
# 与 YOLOv5 参数分开存放，切回 yolov5 时无需重新调参。
yolov8_dynamic_roi_scale: 10.4
yolov8_dynamic_roi_min_width: 208
use_traditional: false
use_roi: false
roi:
    x: 0
    y: 0
    width: 1440
    height: 1080

# YOLOv5 构造时仍会加载传统检测器参数，但此配置不启用传统检测分支。
threshold: 150
max_angle_error: 45
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25

min_detect_count: 5
# 类别投票改判：远距离下模型会在相邻类别之间抖动（实测同一块装甲板在 two/outpost 之间
# 逐帧跳）。追踪器第 0 帧没有先验、走整帧缩放，判错后正确的类别会被名字过滤全部拦掉
# 直到 temp_lost 超时（实测 30 帧里 29 帧卡住）。因此改为：窗口 7 帧内同类出现 5 次，
# 就在还没进入 tracking 的阶段提出改判。只有新类别观测与当前目标的位置、姿态
# 和 EKF 预测连续，才更新观测标签；误捕获为前哨站后若投票改为标准四装甲，
# 会用已接受的观测重建几何并重新累计捕获帧。tracking 期间不改判。
relock_name_window: 7
relock_name_votes: 5
max_temp_lost_count: 15
outpost_max_temp_lost_count: 75
tracker_max_prediction_gap: 0.3
# EKF 观测方位角噪声方差，单位 rad²。
measurement_bearing_variance: 4e-3
# 旧 ID 仍通过门限时，新 ID 排序分数增加此值；单位等效 rad，不改变门限。
association_id_switch_score_margin: 0.05
# 实测标准四装甲旋转半径约 0.22 m，作为 EKF 初始软先验。
# 方差单位为 m²，对应 2 cm 标准差；硬约束仍关闭，后续观测可以继续修正半径。
standard_radius: 0.22
standard_radius_variance: 0.0004
standard_geometry_constraint: false
# 两组装甲的实测旋转半径差为 0；方差单位 m²，对应 1 mm 标准差。
standard_radius_delta_constraint: true
standard_radius_delta_variance: 1e-6
# EKF 初始状态协方差与平移过程噪声；数值沿用当前代码默认值。
# 中心速度方差单位 m²/s²，角速度方差单位 (rad/s)²。
standard_initial_velocity_variance: 64.0
standard_initial_angular_velocity_variance: 0.1
# 平移加速度过程噪声方差单位 m²/s⁴，高度差初始方差单位 m²。
standard_translation_acceleration_variance: 100.0
standard_height_delta_variance: 1.0
# 倒装相机不使用固定俯仰、零滚转的逐点 yaw 重投影优化。
yaw_optimization_enabled: false

# 零偏置仅用于读数诊断，未经实车射击校准。
yaw_offset: 0
pitch_offset: 0
comming_angle: 55
leaving_angle: 20
decision_speed: 7

# 真机 Planner 先只读对比；弹速反馈为 0 时使用诊断参考值，不能用于开火或控制。
planner_debug_bullet_speed_mps: 23.0
fire_thresh: 0.003
# TinyMPC 迭代上限。真机 10526 帧日志实测：yaw 的迭代次数中位正好等于 10（p95 也是 10，
# 即撞在上限上），是 17% 未收敛帧的主要来源；单次求解仅约 0.3ms，放宽上限的代价可忽略。
# 改这个值不需要重编，配 PlotJuggler 看 planner_{yaw,pitch}_solver_status 的 1 占比即可。
planner_max_iter: 10
# TX 到云台反馈的有效滞后估计，单位 ms；Planner 已有约 20 ms 前视，
# 因此 35 ms 会额外前推约 15 ms。该值是待离线复核的补偿起点。
planner_gimbal_response_delay_ms: 35.0
max_yaw_acc: 50
Q_yaw: [9e6, 0]
R_yaw: [1]
max_pitch_acc: 100
Q_pitch: [9e6, 0]
R_pitch: [1]

camera_name: hikrobot
exposure_ms: 2.2
gain: 16.9
vid_pid: "2bdf:0001"

# 来自 configs/intrinsics_real6.yaml（16 样本 / RMS 0.1785px）；图像分辨率为 1440x1080。
# 下面是更早的 intrinsics_real.yaml 标定，仅作历史保留。
# camera_matrix: [1813.2507867127094, 0, 700.04143692942728,
#                 0, 1813.9982777198636, 549.96286809139599,
#                 0, 0, 1]
# distort_coeffs: [-0.078218840095890696, 0.13324667313857205,
#                  -0.00029004829563937019, -0.00044137370499455026, 0]

camera_matrix: [1778.8362739657866, 0, 695.59669148126522, 0, 1779.055534570334, 538.52185867031585, 0, 0, 1]
distort_coeffs: [-0.078139801954700466, 0.13395648291221315, 0.00047676930654277737, -0.00043628031816411267, 0]

# 来自 configs/handeye_real6.yaml（16 样本 / 板位 RMS 13.8mm / 板旋 RMS 0.53deg）。
# 样本内部残差小不等于实车精度已验收；本次 t 的 x 由 4.65cm 变为 16.12cm，需实车复核。
# 相机 optical -> 云台，平移单位 m；串口姿态直接进入 Solver，不使用 IMU 安装轴变换。
# R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]
# R_camera2gimbal: [0.0011726325553053842, -0.036881582043640747, 0.99931895500774071,
#                   0.99984459222970212, -0.017535036256947939, -0.0018204099785029695,
#                   0.017590233708307351, 0.99916578774966336, 0.03685528820468352]
# t_camera2gimbal: [0.13577603026517412, -0.0012125070214705784,
#                   0.039475177662960222]
# 上一版 handeye_real4: t_camera2gimbal: [0.046517088715588344, 0.0068541777415325727, 0.035286262907062611]


R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]  # 相机同理想情况的偏角: yaw-0.36 pitch2.04 roll-178.24 degree
R_camera2gimbal: [-0.0074431558995478476, -0.035395822839819312, 0.99934565349429361, 0.99949908037331892, -0.031005079749661473, 0.0063461297345662063, 0.030760165200231258, 0.99889229687449776, 0.035608868019729199]
t_camera2gimbal: [0.16120640337683581, -0.0030500108943156399, 0.039808182385059905]
