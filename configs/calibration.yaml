# 标定板类型：circles 为当前对称圆点阵，chessboard 为棋盘格。
# 棋盘格模式下，pattern_cols/pattern_rows 表示内角点数量，不是方格数量。
# pattern_type: "circles"
pattern_type: "chessboard"
pattern_cols: 11
pattern_rows: 8
center_distance_mm: 30

R_gimbal2imubody: [1, 0, 0, 0, 1, 0,  0, 0, 1]

camera_name: "hikrobot"
exposure_ms: 8
gain: 15  
vid_pid: "2bdf:0001"

#####-----cboard参数-----#####
quaternion_canid: 0x01
bullet_speed_canid: 0x110
send_canid: 0xff
can_interface: "can0"
